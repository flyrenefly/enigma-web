name: Export levels (murmel.games)

on:
  push:
    branches: [level-export]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev \
            libsdl2-ttf-dev libxerces-c-dev libcurl4-openssl-dev zlib1g-dev xvfb
      - name: Build Enigma
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DENIGMA_SYSTEM_DATA_DIR="$GITHUB_WORKSPACE/data"
          cmake --build build -j4 --target enigma
      - name: Export all levels as JSON
        timeout-minutes: 100
        run: |
          mkdir -p export
          export ENIGMA_EXPORT_JSON="$PWD/export" ENIGMA_EXPORT_SKIP="$PWD/skip.txt"
          export SDL_AUDIODRIVER=dummy HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME"
          touch skip.txt export.log
          # Each run continues where the last one stopped; a level that hangs or
          # crashes is put on the skip list and the export is restarted.
          for attempt in $(seq 1 60); do
            echo "== run $attempt" >> export.log
            xvfb-run -a ./build/src/enigma --makepreview --nosound --nomusic --window >> export.log 2>&1 || true
            if tail -n 3 export.log | grep -q EXPORT-DONE; then break; fi
            bad=$(grep -oE '^EXPORT-(HANG|START [0-9]+/[0-9]+) .*' export.log | tail -n 1 | awk '{print $NF}')
            echo "problem level: ${bad:-unknown}"
            if [ -n "$bad" ]; then echo "$bad" >> skip.txt; else break; fi
          done
          echo "--- skipped (hang/crash):"; cat skip.txt
          grep -E "EXPORT-DONE|EXPORT-FAIL" export.log | tail -n 40 || true
          echo "exported files: $(ls export | wc -l)"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: enigma-levels-json
          path: |
            export/
            export.log
            skip.txt
          retention-days: 30
